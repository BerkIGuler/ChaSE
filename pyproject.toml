[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chase"
version = "0.1.0"
description = "Channel Semantics Evaluation. Probes what wireless channel foundation models learn about the physics of the channel."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Berkay Guler" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "torch>=2.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/BerkIGuler/ChaSE"

[tool.setuptools.packages.find]
include = ["chase*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
